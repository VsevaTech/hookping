<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HookPing{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 22V10h3l4 6 4-6h3v12h-3v-7l-4 6-4-6v7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark">H</span>
      <span>HookPing</span>
    </a>
    <nav class="topnav">
      <a href="/">Inboxes</a>
      <a href="/docs" target="_blank" rel="noopener">API</a>
    </nav>
  </div>
</header>

<main class="container">
  {% if notice %}
    <div class="notice notice-{{ notice_kind }}" role="status">{{ notice }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>

<footer class="container footer">
  <span>HookPing · turn any webhook into a human-readable Telegram notification</span>
</footer>
<script src="/static/app.js" defer></script>
</body>
</html>
