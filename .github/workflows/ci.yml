name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hookping:ci .

      - name: Start container
        run: docker run -d --name hookping -p 8000:8000 hookping:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "HookPing did not become healthy"; docker logs hookping; exit 1

      - name: Smoke test webhook flow
        run: |
          set -euo pipefail
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST http://localhost:8000/inboxes -d 'name=CI Inbox')
          inbox_id=$(echo "$location" | sed -E 's#.*/inboxes/([0-9a-f]+).*#\1#')
          token=$(curl -s "http://localhost:8000/inboxes/$inbox_id" | grep -oE '/h/[A-Za-z0-9_-]{40,}' | head -1 | cut -d/ -f3)
          curl -fsS -X POST "http://localhost:8000/h/$token" -H 'Content-Type: application/json' -d @examples/payment.json
          echo
          curl -s "http://localhost:8000/inboxes/$inbox_id" | grep -q 'badge-not_configured'

      - name: Container logs
        if: always()
        run: docker logs hookping
